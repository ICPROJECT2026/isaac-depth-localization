/**:
  ros__parameters:
    use_sim_time: true
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    use_pcd_map: true
    registration_method: NDT_OMP
    ndt_resolution: 0.3
    ndt_step_size: 0.05
    ndt_max_iterations: 45
    ndt_num_threads: 4
    gicp_corr_randomness: 20
    gicp_max_correspondence_distance: 0.6
    transform_epsilon: 0.001
    voxel_leaf_size: 0.07
    scan_min_range: 0.6
    scan_max_range: 8.5
    min_scan_interval_sec: 0.33
    cloud_queue_depth: 1
    use_imu: false
    use_imu_preintegration: false
    use_continuous_time_deskew: false
    use_odom: false
    use_odom_tf_prediction: true
    constrain_odom_tf_prediction_to_planar: true
    use_twist_prediction: false
    predict_pose_from_previous_delta: false
    enable_map_odom_tf: true
    publish_tf: true
    enable_local_map_crop: true
    local_map_radius: 10.0
    local_map_update_distance: 1.0
    local_map_async_rebuild: true
    viz_downsample: true
    viz_voxel_leaf_size: 0.12
    set_initial_pose: false
    score_threshold: 0.003
    reject_above_score_threshold: true
    enable_timer_publishing: true
    publish_bridge_pose_when_lost: true
    pose_publish_frequency: 15.0
    enable_debug: false
    enable_odom_tf_prediction_correction_guard: true
    odom_tf_prediction_correction_guard_translation_m: 0.08
    odom_tf_prediction_correction_guard_yaw_deg: 3.0
    enable_odom_tf_prediction_recovery_correction_guard: false
    enable_soft_odom_correction_gate: false
